name: Publish main
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  NEW_VERSION: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build and publish pdfgen-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: x64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build gradle artifacts
        shell: bash
        run: |
          ./gradlew build

      - name: Publish Maven package
        run: ./gradlew -Pversion="$NEW_VERSION" publish
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
